name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
          - os: ubuntu-24.04-arm
            target-platform: linux-aarch64
          - os: ubuntu-latest
            target-platform: linux-armv7l
            extra-args: "--test skip"
          - os: macos-latest
            target-platform: osx-64
          - os: macos-latest
            target-platform: osx-arm64
          - os: windows-latest
            target-platform: win-64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.37
        with:
          recipe-path: recipe/recipe.yaml
          build-args: --target-platform ${{ matrix.target-platform }} ${{ matrix.extra-args }}
          upload-artifact: false

      - name: Publish to prefix.dev
        shell: bash
        run: |
          shopt -s nullglob
          EXIT_CODE=0
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            if ! rattler-build upload prefix -c repack "${pkg}"; then
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE
