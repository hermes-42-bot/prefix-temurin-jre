# Rattler-build v1 recipe for Eclipse Temurin JRE (pre-built binaries)
# Adapted from conda-forge/staged-recipes PR #29085
# This is a personal repackaging for prefix.dev channels.

context:
  full_version: "17.0.19+10"
  version: "${{ full_version | split('+') | first }}"
  build_number: "${{ full_version | split('+') | last }}"
  version_underscore: "${{version}}_${{build_number}}"
  base_url: "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-${{ version }}%2B${{ build_number }}/OpenJDK17U-jre_"

package:
  name: temurin-jre
  version: ${{ version }}.${{ build_number }}

source:
  - if: linux and x86_64
    then:
      url: ${{ base_url }}x64_linux_hotspot_${{ version_underscore }}.tar.gz
      sha256: adb5a2364baa51de1ef91bb9911f5a61d24b045fe1d6647cb8050272a3a8ee75
  - if: osx and x86_64
    then:
      url: ${{ base_url }}x64_mac_hotspot_${{ version_underscore }}.tar.gz
      sha256: 91bbd07b9c65d9ecbe1fa0081b3c1ad549ed34ed21085a72fdb76598a740b54c
  - if: win
    then:
      url: ${{ base_url }}x64_windows_hotspot_${{ version_underscore }}.zip
      sha256: 79a598e1fbb4e16582d92c4ee22280a3c4d72fd52606e1e46b1223c0fe53b0da

build:
  number: 0
  script:
    - if: win
      then: bld.bat
      else: build.sh
  prefix_detection:
    ignore_binary_files: true
  dynamic_linking:
    binary_relocation: false
    overlinking_behavior: "ignore"
    missing_dso_allowlist:
      - "*/libc.*"
      - "*/libdl.*"
      - "*/libm.*"
      - "*/libpthread.*"
      - "*/librt.*"
      - "*/ld-linux-x86-64.*"
      - "*/libutil.*"
      - "*/libfreetype.*"
      - "*/libX11.*"
      - "*/libXext.*"
      - "*/libasound.*"
      - "*/libXi.*"
      - "*/libXrender.*"
      - "*/libXtst.*"
      - "*/jvm.dll"
      - "*/java.dll"
      - "*/VCRUNTIME140.dll"
      - "*/VCRUNTIME140_1.dll"
      - "*/MSVCP140.dll"
      - "*/jli.dll"
      - "*/awt.dll"
      - "*/net.dll"
      - "*/jawt.dll"

requirements:
  build:
  run:
    - if: linux
      then: libgcc-ng
    - if: osx
      then: libcxx
    - if: win
      then: ucrt
    - freetype

tests:
  - script:
      - java -version
      - if: unix
        then:
          - $JAVA_HOME/bin/java -version
      - if: win
        then:
          - '"%JAVA_HOME%\\bin\\java.exe" -version'

about:
  summary: Eclipse Temurin OpenJDK-based Java Runtime Environment
  description: |
    The Eclipse Temurin project provides code and processes that support the
    building of runtime binaries and associated technologies that are high
    performance, enterprise-caliber, cross-platform, open-source licensed,
    and Java SE TCK-tested for general use across the Java ecosystem.
    This package repackages the official pre-built JRE binaries from Adoptium.
  license: GPL-2.0-only WITH Classpath-exception-2.0
  license_file: NOTICE
  homepage: https://adoptium.net/temurin/
  repository: https://github.com/adoptium/temurin17-binaries

extra:
  recipe-maintainers:
    - jfouret
